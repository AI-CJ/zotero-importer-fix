name: CSL JSON import
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash verify.sh
      - name: Run Zotero translation-server import tests
        run: bash verify.sh --server
